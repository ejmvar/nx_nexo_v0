# ==============================================================================
# Redis Configuration for QA/Staging Environment
# ==============================================================================
# This configuration is optimized for QA/Staging testing with production-like
# settings but with more relaxed resource constraints.
# ==============================================================================

# Network Configuration
bind 0.0.0.0
protected-mode yes
port 6379

# Security
# Note: Password is set via REDIS_PASSWORD environment variable in docker-compose
# requirepass will be set by Docker Compose

# General
daemonize no
supervised no
pidfile /var/run/redis_6379.pid
loglevel notice
logfile ""
databases 16

# Persistence - RDB (Snapshot)
save 900 1      # Save after 900 seconds (15 minutes) if at least 1 key changed
save 300 10     # Save after 300 seconds (5 minutes) if at least 10 keys changed
save 60 10000   # Save after 60 seconds if at least 10000 keys changed

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Persistence - AOF (Append Only File)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec  # fsync every second (good balance)
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Memory Management
maxmemory 512mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Lazy Freeing
lazyfree-lazy-eviction no
lazyfree-lazy-expire no
lazyfree-lazy-server-del no
replica-lazy-flush no

# Threaded I/O
io-threads 2
io-threads-do-reads no

# Replication (if using master-replica setup)
# replicaof <masterip> <masterport>
# masterauth <master-password>
replica-serve-stale-data yes
replica-read-only yes
repl-diskless-sync no
repl-diskless-sync-delay 5
repl-disable-tcp-nodelay no
replica-priority 100

# Slow Log
slowlog-log-slower-than 10000  # 10ms
slowlog-max-len 128

# Latency Monitor
latency-monitor-threshold 100  # 100ms

# Event Notification
notify-keyspace-events ""

# Advanced Config
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000
stream-node-max-bytes 4096
stream-node-max-entries 100

# Active Rehashing
activerehashing yes

# Client Output Buffer Limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Connection Handling
timeout 300  # Close connection after 300 seconds of idleness
tcp-keepalive 300
tcp-backlog 511
maxclients 1000

# Memory Reporting
# Used for monitoring memory usage
# Check with: INFO memory

# LUA Scripting
lua-time-limit 5000  # 5 seconds

# Cluster Mode (disabled for single-instance setup)
# cluster-enabled no

# Slow Operations
# Monitor with: SLOWLOG GET 10

# ==============================================================================
# QA-Specific Notes:
# - Memory limit: 512MB (sufficient for testing)
# - Persistence: Both RDB and AOF enabled for data safety
# - Slow log: 10ms threshold for performance monitoring
# - Connection limit: 1000 clients (adequate for QA load)
# - Eviction policy: allkeys-lru (remove least recently used keys when full)
# ==============================================================================
