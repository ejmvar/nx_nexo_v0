# ==============================================================================
# Redis Configuration for Production-Like Environment
# ==============================================================================
# This configuration is optimized for production-like performance, security,
# and reliability. Use this for local production simulation (port 7xxx).
#
# WARNING: For REAL production, use Redis Cluster or Redis Sentinel for HA.
# ==============================================================================

# Network Configuration
bind 0.0.0.0
protected-mode yes
port 6379

# Security
# Password MUST be set via REDIS_PASSWORD environment variable
# requirepass is set by Docker Compose using ${REDIS_PASSWORD}
# CHANGE THE DEFAULT PASSWORD!

# General
daemonize no
supervised no
pidfile /var/run/redis_6379.pid
loglevel notice
logfile ""
databases 16

# Persistence - RDB (Snapshot)
# More aggressive snapshot schedule for production
save 900 1      # Save after 900 seconds (15 minutes) if at least 1 key changed
save 300 10     # Save after 300 seconds (5 minutes) if at least 10 keys changed
save 60 10000   # Save after 60 seconds if at least 10000 keys changed
save 30 100000  # Save after 30 seconds if at least 100000 keys changed

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Persistence - AOF (Append Only File)
# AOF provides better durability than RDB
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec  # Good balance between performance and durability
                      # Use "always" for maximum durability (slower)
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes  # Hybrid persistence (RDB + AOF)

# Memory Management
maxmemory 1gb  # Production-like memory limit
maxmemory-policy allkeys-lru  # Evict least recently used keys
maxmemory-samples 10  # More samples = better LRU accuracy (but slower)

# Lazy Freeing (improves performance)
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# Threaded I/O (improves throughput)
io-threads 4  # Use 4 threads (adjust based on CPU cores)
io-threads-do-reads yes

# Replication (if using master-replica setup)
# Uncomment and configure for high availability
# replicaof <masterip> <masterport>
# masterauth <master-password>
replica-serve-stale-data yes
replica-read-only yes
repl-diskless-sync no
repl-diskless-sync-delay 5
repl-disable-tcp-nodelay no
replica-priority 100
min-replicas-to-write 0  # Set to 1+ for production with replicas
min-replicas-max-lag 10

# Security - Rename Dangerous Commands
# Uncomment to disable dangerous commands in production
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command KEYS ""
# rename-command CONFIG "CONFIG_$RANDOM_STRING"
# rename-command SHUTDOWN ""

# Slow Log (for performance monitoring)
slowlog-log-slower-than 10000  # Log queries slower than 10ms
slowlog-max-len 256  # Keep last 256 slow queries

# Latency Monitor
latency-monitor-threshold 100  # Track operations taking 100ms+

# Event Notification (for monitoring)
# Uncomment for keyspace notifications (required for some monitoring tools)
# notify-keyspace-events "Ex"  # Expired events

# Advanced Config
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000
stream-node-max-bytes 4096
stream-node-max-entries 100

# Active Rehashing
activerehashing yes

# Client Output Buffer Limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 512mb 128mb 60  # Larger for production
client-output-buffer-limit pubsub 64mb 16mb 60

# Connection Handling
timeout 300  # Close idle connections after 5 minutes
tcp-keepalive 300
tcp-backlog 511
maxclients 10000  # Support up to 10,000 concurrent clients

# TLS/SSL Configuration (if using encrypted connections)
# Uncomment and configure for encrypted Redis connections
# port 0  # Disable non-TLS port
# tls-port 6379
# tls-cert-file /path/to/redis.crt
# tls-key-file /path/to/redis.key
# tls-ca-cert-file /path/to/ca.crt
# tls-auth-clients optional  # or "yes" for mutual TLS

# LUA Scripting
lua-time-limit 5000  # Max execution time for Lua scripts (5 seconds)

# Cluster Mode (disabled for single-instance)
# For production, consider Redis Cluster for horizontal scaling
# cluster-enabled no

# Monitoring Recommendations
# 1. Monitor memory usage: INFO memory
# 2. Monitor slow queries: SLOWLOG GET 10
# 3. Monitor latency: LATENCY DOCTOR
# 4. Monitor replication lag: INFO replication
# 5. Monitor keyspace: INFO keyspace
# 6. Monitor clients: CLIENT LIST
# 7. Monitor stats: INFO stats

# Performance Tuning
# For high-performance production workloads:
# - Increase io-threads (match CPU cores, max 8)
# - Use appendfsync no (if data loss is acceptable)
# - Disable persistence entirely (if using Redis as pure cache)
# - Use Redis Cluster for horizontal scaling
# - Use Redis Sentinel for automatic failover
# - Monitor with Redis Exporter + Prometheus + Grafana

# Backup Strategy
# 1. RDB snapshots: Automatic via save directives
# 2. AOF: Continuous append-only log
# 3. External backups: Copy RDB/AOF files to S3/backup storage
# 4. Test restores regularly!

# High Availability Options
# 1. Redis Sentinel: Automatic failover with master-replica setup
# 2. Redis Cluster: Horizontal scaling with sharding
# 3. Redis Enterprise: Commercial HA solution
# 4. Cloud providers: AWS ElastiCache, Azure Cache, GCP Memorystore

# ==============================================================================
# Production Checklist:
# ✅ Set strong password via REDIS_PASSWORD
# ✅ Configure persistence (RDB + AOF)
# ✅ Enable lazy freeing for performance
# ✅ Set appropriate memory limit
# ✅ Configure slow log monitoring
# ✅ Set connection limits
# ✅ Consider renaming dangerous commands
# ✅ Enable TLS/SSL for encrypted connections (if needed)
# ✅ Set up backups (RDB/AOF to external storage)
# ✅ Configure monitoring (Prometheus, CloudWatch, etc.)
# ✅ Use Redis Sentinel or Cluster for high availability
# ==============================================================================
